<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="landingPage.css">
    <title>Document</title>
</head>
<body>

    <audio id="waveSound" src="../audioFile/WaveSound.mp3"></audio>
    <audio id="subSound" src="../audioFile/SubmarineSonar.mp3"></audio>
    <audio id="pirateStory" src="../audioFile/pirateAudio.mp3"></audio>

    <main id="firstPage" class="">
        <div id="firstPageItemContainer">  
            <img id="firstPageLogo" src="../images/Logo.png" alt="">
            <button id="storyModeButton" class="firstPageButtons title">Story Mode</button>
            <button id="quickModeButton" class="firstPageButtons title">Quick Mode</button>
            <button id="creditsButton" class="firstPageButtons title">Credits</button>            
        </div>

    </main>
    <main id="portalPage" class="">
        <div id="pirateSkull">
            <img src="../images/pirateFace.png" alt="" class="pirateSkull">
            <img src="../images/pirateJaw.png" alt="" class="pirateJaw animation" id="">
        </div>
        <div class="storyText"></div>

    <main id="landingPageContainer" class="hide">
        <div id="topSectionLandingPage">
            <div id="topCreaturesContainer">
                    
            </div>
        </div>

        <div id="bottomSectionLandingPage">
            <div id="scoreboardContainer">
                <div id="disciplineButtons">
                    <button class="disciplineButton title" id="fightingDiscipline" data-disciplineid="5">Fighting</button>
                    <button class="disciplineButton title" id="raceDiscipline" data-disciplineid="4">Race</button>
                    <button class="disciplineButton title" id="hidenseekDiscipline" data-disciplineid="3">Hide n Seek</button>
                    <button class="disciplineButton title" id="mazeDiscipline" data-disciplineid="1">Maze</button>
                    <button class="disciplineButton title" id="huntDiscipline" data-disciplineid="2">Hunt</button>
                    <button class="disciplineButton title" id="calcRatesButton">Calculate Rates</button>
                </div>
                <div id="scoreboardBottomSection">
                    <div id="scoreboardSeasonContainer">
                        <p class="text">Seasons</p>
                        <div id="scoreboardScrollContainer">
                            <button class="seasonButton title" id="season1Landing" data-currentseason="1">1</button>
                            <button class="seasonButton title" id="season2Landing" data-currentseason="2">2</button>
                            <button class="seasonButton title" id="season3Landing" data-currentseason="3">3</button>
                            <button class="seasonButton title" id="season4Landing" data-currentseason="4">4</button>
                            <button class="seasonButton title" id="season5Landing" data-currentseason="5">5</button>
                            <button class="seasonButton title" id="season6Landing" data-currentseason="6">6</button>
                            <button class="seasonButton title" id="season7Landing" data-currentseason="7">7</button>
                            <button class="seasonButton title" id="season8Landing" data-currentseason="8">8</button>
                            <button class="seasonButton title" id="season9Landing" data-currentseason="9">9</button>
                            <button class="seasonButton title" id="season10Landing" data-currentseason="10">10</button>
                        </div>

                    </div>
                    <div id="scoreboardStatsContainer">
                        <div id="scoreboardListingTitles">
                            <div class="text">Placement</div>
                            <div class="text">Creature</div>
                            <div class="text">Points</div>
                        </div>
                        <div id="creatureScoreboardStats">
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </main>
    <script src="../d3.v7.min.js"></script>
    <script src="../Frontend/dataset.v2.js"></script>
    <script src="linus.js"></script>
</body>
</html>
