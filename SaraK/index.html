<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="comparePage.css">
    <link rel="stylesheet" href="../common.css">
</head>

<body>

    <main id="storyPage" class="hide">
        <div id="pirateSkull">
            <img src="./images/pirateFace.png" alt="" class="pirateSkull">
            <img src="./images/pirateJaw.png" alt="" class="pirateJaw animation">
        </div>
        <div class="storyText"></div>


    </main>


    <main id="creditsPage" class="hide">
        <img src="../images/backArrow.png" class="backArrow" id="backArrowCredits" alt="">


        <div id="containerCredits">

            <h1>Credits</h1>

            <div class="textDiv">
                <h2>Lead designer</h1>
                    <p>Ahmet Börütecne</p>
            </div>
            <div class="textDiv">
                <h2>Designer</h1>
                    <p>Sara Karlsson</p>
                    <p>Sara Boughiout </p>
                    <p>Linus Strandberg</p>
            </div>
            <div class="textDiv">
                <h2>Lead programmer</h1>
                    <p>Erik Pineiro</p>
            </div>
            <div class="textDiv">
                <h2>Programmers </h1>
                    <p>Sara Karlsson</p>
                    <p>Sara Boughiout </p>
                    <p>Linus Strandberg</p>
            </div>

            <div class="textDiv">
                <h2>Fika Manager </h1>
                    <p>Linus Strandberg</p>
            </div>
        </div>

    </main>




    <main id="comparePage">
        <img src="../images/backArrow.png" id="backArrowCompare" class="backArrow" alt="">
        <div id="containerParticipants">

            <h2 class="containerTitle">Participants</h2>
            <input type="text" id="inputIdField" placeholder="Search Monster Id">


            <div id="containerAllMonstersBox">
                <!-- <div class="monsterCard">
                </div>
                <div class="monsterCard"></div> -->



            </div>

            <div id="containerButtons">
                <button class="buttonParticipants" id="clearSelectionButton">Clear Selection</button>
                <button class="buttonParticipants" id="selectRandomButton">Select Random</button>
            </div>
        </div>


        <div id="containerGraphs">
            <h2 class="containerTitle">Skill Points</h2>

            <div id="searchBars">

                <select name="seasonsDropDown" id="seasonsDropDown">
                    <option value="">--Choose a season--</option>
                    <option value="season1">Season 1</option>
                    <option value="season2">Season 2</option>
                    <option value="season3">Season 3</option>
                    <option value="season4">Season 4</option>
                    <option value="season5">Season 5</option>
                    <option value="season6">Season 6</option>
                    <option value="season7">Season 7</option>
                    <option value="season8">Season 8</option>
                    <option value="season9">Season 9</option>
                    <option value="season10">Season 10</option>
                </select>
            </div>

            <div id="skillDistrubution">
                <h3 class="graphTitle">Skill Distribution</h3>
            </div>
            <div id="pointsDistrubution">
                <h3 class="graphTitle">Point Distribution</h3>
            </div>


        </div>
    </main>

    <script src="../Frontend/dataset.v2.js"></script>
    <script src="../d3.v7.min.js"></script>
    <script type="module" src="saraK.js"></script>
    <script type="module" src="monsterClass.js"></script>
</body>

</html>
